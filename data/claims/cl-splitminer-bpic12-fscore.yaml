id: cl-splitminer-bpic12-fscore
statement: >-
  Auf dem Log BPIC12 erreicht Split Miner mit den Standardparametern der Studie
  einen höheren F-Score als Inductive Miner.
scope: >-
  BPIC12 in der Fassung der Studie, Standardparameter beider Verfahren, F-Score aus
