id: goal-higgs-boson
field: Physik
area: '103'
topic: Higgs-Boson
title: Das Higgs-Boson nachweisen, seine Masse und seine Zerfälle bestimmen
last_work: Fünf Veröffentlichungen mit fünf Belegen als Vorschlag erfasst
open_question: Zweite Person gleicht Signifikanzen und Massenwerte mit den Veröffentlichungen ab
milestones:
- id: ms-higgs-nachweis
  title: Neues Boson nachweisen
  criterion: Ein Experiment berichtet in einer begutachteten Veröffentlichung ein neues Boson mit einer
    Signifikanz von mindestens 5 σ.
  note: Vorschlag liegt vor, Zweitprüfung offen.
- id: ms-higgs-zweites-experiment
  title: Mit zweitem Experiment bestätigen
  criterion: Ein zweites Experiment mit eigenem Detektor berichtet das Teilchen mit mindestens 5 σ.
  note: Vorschlag liegt vor, Zweitprüfung offen.
- id: ms-higgs-masse
  title: Masse gemeinsam bestimmen
  criterion: Eine gemeinsame Auswertung beider Experimente bestimmt die Masse mit einer Unsicherheit unter
    0,5 GeV.
  note: Vorschlag liegt vor, Zweitprüfung offen.
- id: ms-higgs-bottom
  title: Zerfall in Bottom-Quarks beobachten
  criterion: Ein Experiment berichtet den Zerfall in Bottom-Quarks mit einer Signifikanz von mindestens
    5 σ.
  note: Vorschlag liegt vor, Zweitprüfung offen.
- id: ms-higgs-bottom-zweites-experiment
  title: Zerfall mit zweitem Experiment bestätigen
  criterion: Ein zweites Experiment berichtet den Zerfall mit mindestens 5 σ.
  note: Vorschlag liegt vor, Zweitprüfung offen.
