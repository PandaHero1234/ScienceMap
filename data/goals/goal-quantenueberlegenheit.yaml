id: goal-quantenueberlegenheit
field: Informatik
area: '102'
topic: Quantenüberlegenheit
title: Einen Rechenvorteil eines Quantenprozessors gegenüber klassischen Rechnern belegen
last_work: Vier Veröffentlichungen mit fünf Belegen als Vorschlag erfasst
open_question: Zweite Person prüft, ob spätere Simulationen auch diese Schätzungen überholt haben
milestones:
- id: ms-qc-experiment
  title: Experiment berichten
  criterion: Eine begutachtete Veröffentlichung berichtet eine Aufgabe, die ein Quantenprozessor in Minuten
    löst.
  note: Vorschlag liegt vor, Zweitprüfung offen.
- id: ms-qc-klassischer-aufwand
  title: Klassischen Aufwand absichern
  criterion: Die Schätzung des klassischen Aufwands hält einer unabhängigen Nachrechnung stand.
  note: Vorschlag liegt vor, Zweitprüfung offen.
- id: ms-qc-zweite-plattform
  title: Auf einer zweiten Plattform zeigen
  criterion: Ein Experiment mit anderer Technik berichtet eine Aufgabe, für die klassische Rechner nach
    Schätzung der Gruppe weit länger brauchen.
  note: Vorschlag liegt vor, Zweitprüfung offen.
- id: ms-qc-groesserer-prozessor
  title: Mit größerem supraleitendem Prozessor wiederholen
  criterion: Ein Experiment mit mehr Qubits als bei Sycamore berichtet eine Aufgabe mit höherem geschätztem
    klassischem Aufwand.
  note: Vorschlag liegt vor, Zweitprüfung offen.
