id: goal-proteinstruktur-vorhersage
field: Biologie
area: '106'
topic: Proteinstrukturvorhersage
title: Proteinstrukturen aus der Sequenz mit experimentnaher Genauigkeit vorhersagen
last_work: Vier Veröffentlichungen mit vier Belegen als Vorschlag erfasst
open_question: Zweite Person trägt die Zahlenwerte des zweiten Verfahrens aus dem Volltext nach
milestones:
- id: ms-protein-blindtest
  title: Im Blindvergleich bestehen
  criterion: Ein Verfahren erreicht in einem verblindeten Vergleich eine mittlere Abweichung des Rückgrats
    von höchstens 1 Å.
  note: Vorschlag liegt vor, Zweitprüfung offen.
- id: ms-protein-zweites-verfahren
  title: Mit zweitem Verfahren bestätigen
  criterion: Ein von einer anderen Gruppe entwickeltes Verfahren erreicht Genauigkeiten nahe dem ersten.
  note: Vorschlag liegt vor, Zweitprüfung offen.
- id: ms-protein-datenbank
  title: Vorhersagen für fast alle bekannten Proteine bereitstellen
  criterion: Eine frei zugängliche Datenbank enthält Vorhersagen für mehr als 100 Millionen Proteine.
  note: Vorschlag liegt vor, Zweitprüfung offen.
- id: ms-protein-komplexe
  title: Komplexe mit anderen Molekülen vorhersagen
  criterion: Eine begutachtete Veröffentlichung berichtet ein Verfahren, das Komplexe aus Proteinen, Nukleinsäuren
    und kleinen Molekülen genauer vorhersagt als spezialisierte Werkzeuge.
  note: Vorschlag liegt vor, Zweitprüfung offen.
- id: ms-protein-komplexe-unabhaengig
  title: Vorhersage von Komplexen unabhängig prüfen
  criterion: Eine Gruppe außerhalb der Entwickler bestätigt die Genauigkeit in einem eigenen Vergleich.
  note: Offen. Im Atlas ist kein Beleg erfasst.
